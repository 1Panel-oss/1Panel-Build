name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build-offline-installer:
    name: Build Offline Installer (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache frontend deps
        uses: actions/cache@v4
        with:
          path: 1Panel-source/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('1Panel-source/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build binaries
        run: |
          if [ ! -d "1Panel-source/.git" ]; then \
            git clone --depth 1 --branch dev-v2 https://github.com/1Panel-dev/1Panel.git 1Panel-source; \
          fi
          chmod +x scripts/build.sh
          ./scripts/build.sh --goos linux --goarch ${{ matrix.arch }}

      - name: Package offline installer
        env:
          PANEL_SRC: 1Panel-source
          INSTALLER_SRC: installer-source
        run: |
          if [ ! -d "${INSTALLER_SRC}/.git" ]; then \
            git clone --depth 1 --branch v2 https://github.com/1Panel-dev/installer.git ${INSTALLER_SRC}; \
          fi
          chmod +x scripts/release.sh
          ./scripts/release.sh --goos linux --goarch ${{ matrix.arch }} --no-iptables

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-offline-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
